[package]
name = "sa-app"
description = "GTA San Andreas world viewer on Bevy"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
sa-formats.workspace = true
sa-physics = { path = "../sa-physics", features = ["bevy"] }
sa-fx = { path = "../sa-fx" }
bevy_mod_imgui = "0.10"
anyhow.workspace = true
serde_json = "1"
# The PCM sound source for SA's SFX banks (the rodio bevy_audio uses).
rodio = { version = "0.22", default-features = false }
bevy.workspace = true
sc2-bevy = { path = "../sc2-bevy", optional = true, default-features = false }

[features]
default = ["dev"]
# StarCraft II units in the world, simulated by a retail SC2 client (see crates/sc2-bevy).
sc2 = ["dep:sc2-bevy"]
# Bevy as a shared library: incremental rebuilds only relink our crate.
# Disable for distributable builds: cargo build --release --no-default-features
dev = ["bevy/dynamic_linking"]
# Chrome trace of the frame (TRACE_CHROME=<file.json>) for profiling.
trace = ["bevy/trace_chrome"]

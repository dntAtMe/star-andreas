[package]
name = "sa-app"
description = "GTA San Andreas world viewer on Bevy"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
sa-formats.workspace = true
anyhow.workspace = true
bevy.workspace = true
bevy_rapier3d.workspace = true

[features]
default = ["dev"]
# Bevy as a shared library: incremental rebuilds only relink our crate.
# Disable for distributable builds: cargo build --release --no-default-features
dev = ["bevy/dynamic_linking"]
